plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
}

repositories {
    // mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/Ingenieria-en-sistemas-2025/PrintScriptV1")
        credentials {
            username = findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = findProperty("gpr.key")  ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    implementation "org.printscript:common:1.0.0-SNAPSHOT"
    implementation "org.printscript:token:1.0.0-SNAPSHOT"
    implementation "org.printscript:ast:1.0.0-SNAPSHOT"
    implementation "org.printscript:lexer:1.0.0-SNAPSHOT"
    implementation "org.printscript:parser:1.0.0-SNAPSHOT"
    implementation "org.printscript:analyzer:1.0.0-SNAPSHOT"
    implementation "org.printscript:formatter:1.0.0-SNAPSHOT"
    implementation "org.printscript:interpreter:1.0.0-SNAPSHOT"
    implementation "org.printscript:runner:1.0.0-SNAPSHOT"
    testImplementation 'junit:junit:4.13.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
    minHeapSize = "5m"
    maxHeapSize = "7m"
}


